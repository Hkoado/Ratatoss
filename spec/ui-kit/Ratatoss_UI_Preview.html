  --rt-progress-height: 5px;
  --rt-graph-height: 354px;
  --rt-graph-node-width: 148px;
  --rt-graph-node-min-height: 77px;
  --rt-graph-node-progress-height: 3px;
  --rt-graph-grid-step: 22px;
  --rt-graph-stroke: 1.8px;
  --rt-graph-active-stroke: 2.3px;
  --rt-login-width: 430px;
  --rt-dialog-padding: 29px;
  --rt-dropzone-padding-block: 32px;
  --rt-dropzone-padding-inline: 23px;
  --rt-dropzone-radius: 12px;
  --rt-device-icon-size: 35px;
  --rt-peer-switch-width: 38px;
  --rt-peer-switch-height: 22px;
  --rt-peer-switch-knob: 16px;
  --rt-transfer-summary-gap: 18px;

  /* Animation timings. Flow dash means activity only in demo or verified events. */
  --rt-motion-fast: 120ms;
  --rt-motion-normal: 180ms;
  --rt-motion-slow: 240ms;
  --rt-motion-progress: 550ms;
  --rt-motion-flow-loop: 1350ms;
  --rt-easing-standard: ease;

  /* Responsive cutoffs; CSS @media currently duplicates numbers below because
     CSS custom properties cannot be used in media query features. */
  --rt-breakpoint-wide: 1300px;
  --rt-breakpoint-compact: 1100px;
  --rt-breakpoint-tablet: 850px;
  --rt-breakpoint-mobile: 560px;

  /* Backwards-compatible alias names used in component rules. */
  --accent: var(--rt-brand-500);
  --accent2: var(--rt-brand-400);
  --accent-deep: var(--rt-brand-700);
  --green: var(--rt-success-500);
  --blue: var(--rt-info-500);
  --yellow: var(--rt-warning-500);
  --red: var(--rt-danger-500);
  --white: var(--rt-light-0);
  --accent-soft: rgba(244,122,40,.11);
  font-family: var(--rt-font-family-body);
  font-synthesis: none;
}

body[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1014;
  --sidebar: #111318;
  --panel: #171a20;
  --panel-2: #1d2027;
  --panel-3: #252932;
  --text: #f5f5f3;
  --muted: #9399a6;
  --muted2: #6d7380;
  --stroke: #2c3038;
  --stroke-strong: #42464e;
  --shadow: none;
  --graph: #14171d;
  --chip: #24282f;
  --outline: #32343a;
  --input: #1c2027;
  --hover: #24272e;
  --orbon: #291b15;
  --rt-accent-on-surface: #ff9d50;
  --rt-on-accent: #20140e;
  --rt-focus-color: rgba(244,122,40,.65);
}

body[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f5f2;
  --sidebar: #fbfaf8;
  --panel: #ffffff;
  --panel-2: #f8f8f7;
  --panel-3: #efefed;
  --text: #22242a;
  --muted: #757a83;
  --muted2: #999da4;
  --stroke: #e7e7e4;
  --stroke-strong: #d4d4d0;
  --shadow: none;
  --graph: #faf9f7;
  --chip: #f1f1ef;
  --outline: #e5e4e1;
  --input: #fbfaf8;
  --hover: #f0efed;
  --orbon: #fff2e9;
  --rt-accent-on-surface: #a84410;
  --rt-on-accent: #20140e;
  --rt-focus-color: rgba(173,71,16,.72);
}

/* RATATOSS UI COMPONENT RULES — canonical tokens live in tokens.css.
   Standalone/preview works offline; installed font fallbacks are used. */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  transition: background .2s,color .2s;
}

button,input,select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .43;
}

button:focus-visible,input:focus-visible,select:focus-visible,.clickable:focus-visible {
  outline: var(--rt-focus-width) solid var(--rt-focus-color);
  outline-offset: var(--rt-focus-offset);
}

a {
  color: inherit;
  text-decoration: none;
}

svg {
  flex-shrink: 0;
}

h1,h2,h3,h4,p {
  margin-top: 0;
}

h1,h2,h3 {
  font-family: var(--rt-font-family-heading);
  letter-spacing: -.035em;
}

p {
  line-height: 1.58;
}

.app-shell {
  min-height: 100vh;
  display: flex;
}

.sidebar {
  width: var(--rt-sidebar-width);
  flex: 0 0 var(--rt-sidebar-width);
  min-height: 100vh;
  background: var(--sidebar);
  border-right: 1px solid var(--stroke);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  padding: var(--rt-sidebar-padding-block) var(--rt-sidebar-padding-inline) var(--rt-sidebar-padding-bottom);
  z-index: 10;
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 0 11px 39px;
}

.brand-logo {
  height: var(--rt-logo-size);
  width: var(--rt-logo-size);
  box-shadow: none;
  border-radius: var(--rt-radius-lg);
}

.brand-title {
  font-family: var(--rt-font-family-heading);
  font-size:var(--rt-font-3xl);
  font-weight: 800;
  letter-spacing: -.055em;
}

.brand-sub {
  font-size:var(--rt-font-xxs);
  color: var(--muted);
  letter-spacing: .11em;
  text-transform: uppercase;
  margin-top: 3px;
  font-weight: 700;
}

.side-label {
  padding: 0 13px;
  margin-bottom: 12px;
  font-size:var(--rt-font-xxs);
  letter-spacing: .15em;
  color: var(--muted2);
  font-weight: 800;
}

.side-nav {
  display: flex;
  flex-direction: column;
  gap: var(--rt-space-1);
}

.nav-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted);
  height: var(--rt-nav-item-height);
  border-radius: var(--rt-radius-md);
  text-align: left;
  display: flex;
  align-items: center;
  gap: var(--rt-space-3);
  padding: 0 var(--rt-space-3);
  font-weight: 600;
  font-size: var(--rt-font-sm);
  width: 100%;
  transition: background .16s,color .16s;
}

.nav-btn:hover {
  background: var(--hover);
  color: var(--text);
}

.nav-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: rgba(244,122,40,.12);
}

.nav-btn.active svg {
  stroke: var(--accent);
}

.nav-count {
  margin-left: auto;
  background: var(--panel-3);
  padding: 2px 7px;
  border-radius: 6px;
  font-size:var(--rt-font-xs);
  color: var(--muted);
}

.nav-btn.active .nav-count {
  background: rgba(244,122,40,.17);
  color: var(--accent);
}

.side-spacer {
  flex: 1;
}

.engine-card {
  border: 1px solid var(--stroke);
  background: var(--panel);
  border-radius: 12px;
  padding: 14px;
  margin: 15px 3px 18px;
}

.engine-title {
  font-size:var(--rt-font-sm);
  font-weight: 750;
  display: flex;
  align-items: center;
  gap: 9px;
}

.engine-body {
  font-size:var(--rt-font-xs);
  line-height: 1.55;
  color: var(--muted);
  margin: 7px 0 0;
}

.dot {
  display: inline-block;
  height: 7px;
  width: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: none;
}

.dot.demo-dot {
  background: var(--accent);
  box-shadow: none;
}

.side-profile {
  display: flex;
  gap: 10px;
  align-items: center;
  border-top: 1px solid var(--stroke);
  padding: 17px 9px 0;
  cursor: pointer;
  width: 100%;
  background: transparent;
  color: var(--text);
  text-align: left;
  border-left: 0;
  border-right: 0;
  border-bottom: 0;
}

.side-profile:hover {
  background: var(--hover);
}

.avatar {
  height: 36px;
  width: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  color: #b95118;
  background: #fce7d6;
  font-weight: 800;
  font-size:var(--rt-font-sm);
  flex-shrink: 0;
}

.profile-name {
  display: block;
  font-size:var(--rt-font-sm);
  font-weight: 750;
}

.profile-caption {
  display: block;
  color: var(--muted);
  font-size:var(--rt-font-xxs);
  margin-top: 4px;
}

.side-profile .chev {
  margin-left: auto;
  color: var(--muted2);
}

.main {
  min-width: 0;
  flex: 1;
  max-width: calc(100% - var(--rt-sidebar-width));
}

.topbar {
  height: var(--rt-topbar-height);
  border-bottom: 1px solid var(--stroke);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--rt-content-inline);
  gap: 15px;
}

.crumb {
  font-size:var(--rt-font-sm);
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 10px;
}

.crumb strong {
  color: var(--text);
  font-weight: 650;
}

.crumb-sep {
  color: var(--muted2);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-btn {
  border: 1px solid var(--stroke);
  color: var(--muted);
  background: var(--panel);
  width: var(--rt-icon-button-size);
  height: var(--rt-icon-button-size);
  border-radius: var(--rt-radius-md);
  display: grid;
  place-items: center;
  transition: color .15s,background .15s;
}

.icon-btn:hover {
  color: var(--accent);
  background: var(--hover);
}

.pill {
  font-size:var(--rt-font-xxs);
  letter-spacing: .03em;
  font-weight: 750;
  border-radius: 100px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 11px;
  white-space: nowrap;
}

.pill.amber {
  background: var(--accent-soft);
  color: var(--accent);
}

.pill.neutral {
  background: var(--chip);
  color: var(--muted);
}

.pill.green {
  color: var(--green);
  background: rgba(73,200,153,.09);
}

.pill.red {
  color: var(--red);
  background: rgba(238,123,117,.1);
}

.content {
  padding: var(--rt-content-top) var(--rt-content-inline) var(--rt-content-bottom);
  max-width: var(--rt-content-max);
  margin: auto;
}

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 18px;
  margin-bottom: 26px;
}

.eyebrow {
  font-size:var(--rt-font-xs);
  font-weight: 800;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .15em;
  margin-bottom: 11px;
}

.page-head h1 {
  font-size: clamp(var(--rt-font-page-min),2.3vw,var(--rt-font-page-max));
  line-height: 1.24;
  margin: 0 0 9px;
  font-weight: 800;
}

.page-head p {
  font-size:var(--rt-font-md);
  color: var(--muted);
  margin: 0;
  max-width: 680px;
}

.head-buttons {
  display: flex;
  gap: 9px;
  align-items: center;
  margin-top: 11px;
  flex-shrink: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border-radius: var(--rt-radius-md);
  border: 1px solid transparent;
  padding: var(--rt-button-padding-y) var(--rt-button-padding-x);
  white-space: nowrap;
  font-size:var(--rt-font-sm);
  font-weight: 800;
  transition: transform .12s,background .14s;
}

.btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.btn.primary {
  color: #1e140e;
  background: var(--accent);
}

.btn.primary:hover {
  background: var(--accent2);
}

.btn.secondary {
  background: var(--panel);
  border-color: var(--stroke);
  color: var(--text);
}

.btn.ghost {
  background: transparent;
  color: var(--muted);
  border-color: var(--stroke);
}

.btn.danger {
  color: var(--red);
  border: 1px solid rgba(238,123,117,.24);
  background: rgba(238,123,117,.05);
}

.btn.small {
  padding: var(--rt-space-2) var(--rt-space-3);
  border-radius: var(--rt-radius-sm);
  font-size:var(--rt-font-xs);
}

.btn.wide {
  width: 100%;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 15px;
  margin-bottom: 20px;
}

.stat-card {
  padding: 19px 20px 17px;
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: var(--rt-card-radius);
  position: relative;
  overflow: hidden;
}

.stat-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size:var(--rt-font-xs);
  color: var(--muted);
  font-weight: 650;
  margin-bottom: 15px;
}

.stat-icon {
  height: 28px;
  width: 28px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
}

.stat-value {
  font-family: var(--rt-font-family-heading);
  font-size: var(--rt-font-kpi);
  font-weight: 800;
  letter-spacing: -.07em;
  line-height: 1.1;
}

.stat-meta {
  font-size:var(--rt-font-xxs);
  margin-top: 9px;
  color: var(--muted);
}

.stat-meta .up {
  color: var(--green);
  font-weight: 700;
}

.split {
  display: grid;
  grid-template-columns: minmax(0,1.65fr) minmax(290px,.85fr);
  gap: 20px;
  align-items: stretch;
}

.card {
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: var(--rt-card-radius);
  min-width: 0;
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: var(--rt-card-header-padding);
}

.card-title {
  font-size: var(--rt-font-card-title);
  letter-spacing: -.025em;
  font-weight: 800;
  margin: 0;
}

.card-desc {
  font-size:var(--rt-font-xs);
  color: var(--muted);
  margin: 5px 0 0;
}

.card-tools {
  display: flex;
  gap: 7px;
}

.card-body {
  padding: var(--rt-card-body-padding);
}

.tag {
  border: 1px solid var(--stroke);
  background: var(--chip);
  border-radius: 7px;
  color: var(--muted);
  font-size:var(--rt-font-xxs);
  padding: 6px 9px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 750;
}

.tag.orange {
  color: var(--accent);
  background: var(--accent-soft);
  border-color: rgba(244,122,40,.16);
}

.topology-canvas {
  height: var(--rt-graph-height);
  position: relative;
  overflow: hidden;
  background: var(--graph);
  border-top: 1px solid var(--stroke);
  border-bottom: 1px solid var(--stroke);
  background-image: radial-gradient(var(--outline) 0.8px,transparent .8px);
  background-size: var(--rt-graph-grid-step) var(--rt-graph-grid-step);
}

.net-lines {
  position: absolute;
  inset: 0;
  height: 100%;
  width: 100%;
  overflow: visible;
}

.net-lines path {
  fill: none;
  stroke: var(--stroke-strong);
  stroke-width: var(--rt-graph-stroke);
  opacity: .65;
}

.net-lines path.active-flow {
  stroke: var(--accent);
  stroke-width: var(--rt-graph-active-stroke);
  stroke-dasharray: 7 9;
  animation: flow var(--rt-motion-flow-loop) linear infinite;
  opacity: 1;
}

.net-lines path.local-flow {
  stroke: var(--blue);
}

.net-lines path.conditional {
  stroke: var(--stroke-strong);
  stroke-dasharray: 3 8;
  opacity: .55;
}

.net-lines path.offline-flow {
  stroke: var(--red);
  stroke-dasharray: 3 9;
  opacity: .4;
  animation: none;
}

.net-lines marker path {
  fill: var(--accent);
  stroke: none;
}

.flow-tag {
  position: absolute;
  padding: 4px 8px;
  background: var(--panel);
  border: 1px solid var(--stroke);
  font-size: 9px;
  font-weight: 750;
  color: var(--muted);
  border-radius: 6px;
  white-space: nowrap;
  transform: translate(-50%,-50%);
  pointer-events: none;
}

.flow-tag.wan1 {
  left: 30%;
  top: 30%;
}

.flow-tag.wan2 {
  left: 71%;
  top: 30%;
}

.flow-tag.lan {
  left: 50%;
  top: 58%;
}

.flow-tag.down {
  left: 72%;
  top: 77%;
}

.flow-tag span {
  color: var(--accent);
}

.graph-node {
  position: absolute;
  width: var(--rt-graph-node-width);
  min-height: var(--rt-graph-node-min-height);
  transform: translate(-50%,-50%);
  border: 1px solid var(--stroke-strong);
  box-shadow: none;
  border-radius: var(--rt-graph-node-radius);
  background: var(--panel);
  padding: 10px;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  transition: border-color .12s;
}

.graph-node:hover,.graph-node.selected {
  border-color: var(--accent);
  box-shadow: none;
}

.graph-node.offline {
  opacity: .58;
}

.node-top {
  display: flex;
  align-items: center;
  gap: 8px;
}

.node-icon {
  height: 27px;
  width: 27px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: var(--accent);
  background: var(--accent-soft);
}

.node-title {
  display: block;
  font-size:var(--rt-font-xs);
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.node-sub {
  display: block;
  font-size: 9px;
  color: var(--muted);
  margin-top: 3px;
}

.node-progress {
  height: var(--rt-graph-node-progress-height);
  border-radius: 3px;
  background: var(--stroke);
  margin-top: 10px;
  overflow: hidden;
}

.node-progress span {
  height: 100%;
  display: block;
  background: var(--accent);
  border-radius: 3px;
}

.graph-node.offline .node-progress span {
  background: var(--red);
}

.node-percent {
  font-size: 9px;
  color: var(--muted);
  margin-top: 6px;
  display: flex;
  justify-content: space-between;
}

.graph-note {
  padding: 12px 18px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  font-size:var(--rt-font-xxs);
  color: var(--muted);
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 17px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
}

.legend-line {
  height: 2px;
  width: 18px;
  background: var(--accent);
}

.legend-line.blue {
  background: var(--blue);
}

.legend-line.dashed {
  background: repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px);
}

.graph-footer {
  font-size:var(--rt-font-xxs);
  color: var(--muted);
  padding: 12px 21px;
  border-top: 1px solid var(--stroke);
  display: flex;
  align-items: center;
  gap: 8px;
}

.right-list {
  padding: 4px 19px 11px;
}

.peer-progress {
  padding: 16px 0;
  border-bottom: 1px solid var(--stroke);
}

.peer-progress:last-child {
  border-bottom: none;
}

.pp-top {
  display: flex;
  align-items: center;
  gap: 11px;
}

.device-icon {
  height: var(--rt-device-icon-size);
  width: var(--rt-device-icon-size);
  background: var(--panel-3);
  border: 1px solid var(--stroke);
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--muted);
  flex-shrink: 0;
}

.pp-name {
  font-size:var(--rt-font-xs);
  font-weight: 800;
}

.pp-sub {
  color: var(--muted);
  font-size:var(--rt-font-xxs);
  margin-top: 5px;
}

.pp-pct {
  margin-left: auto;
  color: var(--text);
  font-size:var(--rt-font-md);
  font-weight: 800;
}

.progress-track {
  height: var(--rt-progress-height);
  border-radius: 8px;
  background: var(--stroke);
  overflow: hidden;
  margin-top: 13px;
}

.progress-fill {
  height: 100%;
  border-radius: 8px;
  background: var(--accent);
  transition: width .55s;
}

.progress-fill.green {
  background: var(--green);
}

.progress-fill.red {
  background: var(--red);
}

.mini-info {
  margin: 13px 18px 16px;
  padding: 14px;
  border-radius: 10px;
  background: var(--accent-soft);
  display: flex;
  gap: 10px;
  color: var(--accent);
  align-items: flex-start;
}

.mini-info p {
  margin: 0;
  color: var(--muted);
  font-size:var(--rt-font-xxs);
  line-height: 1.6;
}

.mini-info strong {
  color: var(--text);
  display: block;
  font-size:var(--rt-font-xxs);
  margin-bottom: 4px;
}

.lower-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 20px;
}

.events {
  padding: 1px 19px 14px;
}

.event-row {
  display: flex;
  gap: 11px;
  align-items: flex-start;
  padding: 14px 2px;
  border-bottom: 1px solid var(--stroke);
}

.event-row:last-child {
  border: 0;
}

.event-bullet {
  height: 24px;
  width: 24px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: var(--accent);
  background: var(--accent-soft);
}

.event-label {
  font-size:var(--rt-font-xs);
  font-weight: 700;
  line-height: 1.45;
}

.event-sub {
  font-size:var(--rt-font-xxs);
  color: var(--muted);
  margin-top: 5px;
}

.event-time {
  margin-left: auto;
  white-space: nowrap;
  color: var(--muted2);
  font-size:var(--rt-font-xxs);
}

.insight-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 20px 20px;
}

.insight {
  border: 1px solid var(--stroke);
  border-radius: 11px;
  padding: 14px;
  background: var(--panel-2);
}

.insight-number {
  font-size: 20px;
  font-family: var(--rt-font-family-heading);
  font-weight: 800;
  letter-spacing: -.055em;
}

.insight-caption {
  font-size:var(--rt-font-xxs);
  color: var(--muted);
  margin-top: 5px;
}

.section-label {
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .12em;
  font-size:var(--rt-font-xxs);
  font-weight: 800;
  margin: 0 0 14px;
}

.search-bar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 260px;
  border: 1px solid var(--stroke);
  background: var(--input);
  padding: 0 13px;
  border-radius: 10px;
  color: var(--muted);
}

.search-bar input {
  width: 100%;
  height: 40px;
  border: 0;
  outline: none !important;
  background: transparent;
  color: var(--text);
  font-size:var(--rt-font-sm);
}

.device-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: var(--rt-grid-gap);
}

.device-card {
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: 14px;
  padding: 18px;
  min-width: 0;
  transition: border .17s;
}

.device-card.checked {
  border-color: rgba(244,122,40,.7);
}

.device-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.check-peer {
  height: 22px;
  width: 22px;
  border-radius: 7px;
  border: 1px solid var(--stroke-strong);
  display: grid;
  place-items: center;
  color: transparent;
  background: var(--panel-2);
}

.checked .check-peer {
  background: var(--accent);
  border-color: var(--accent);
  color: #20120b;
}

.device-card h3 {
  font-size:var(--rt-font-xl);
  margin: 16px 0 5px;
}

.device-card .device-meta {
  color: var(--muted);
  font-size:var(--rt-font-xs);
}

.device-card .divider {
  height: 1px;
  background: var(--stroke);
  margin: 16px 0;
}

.device-facts {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size:var(--rt-font-xxs);
}

.device-facts strong {
  display: block;
  color: var(--text);
  margin-top: 5px;
  font-size:var(--rt-font-sm);
}

.device-card footer {
  margin-top: 17px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.switch {
  width: var(--rt-peer-switch-width);
  height: var(--rt-peer-switch-height);
  border-radius: 50px;
  background: var(--stroke-strong);
  display: flex;
  align-items: center;
  padding: 3px;
  position: relative;
  border: 0;
  flex-shrink: 0;
  transition: background .15s;
}

.switch:after {
  content: "";
  height: var(--rt-peer-switch-knob);
  width: var(--rt-peer-switch-knob);
  border-radius: 50%;
  background: white;
  display: block;
  transition: transform .18s;
}

.switch.on {
  background: var(--accent);
}

.switch.on:after {
  transform: translateX(16px);
}

.switch:disabled {
  opacity: .35;
}

.form-grid {
  display: grid;
  grid-template-columns: minmax(0,1.1fr) minmax(290px,.72fr);
  gap: var(--rt-grid-gap);
}

.panel-block {
  padding: 21px;
}

.step-header {
  display: flex;
  gap: 11px;
  align-items: center;
  margin-bottom: 20px;
}

.step-number {
  height: 30px;
  width: 30px;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
  font-size:var(--rt-font-sm);
  font-weight: 850;
}

.step-header h3 {
  font-size:var(--rt-font-lg);
  margin: 0;
}

.step-header p {
  color: var(--muted);
  font-size:var(--rt-font-xs);
  margin: 4px 0 0;
}

.dropzone {
  padding: var(--rt-dropzone-padding-block) var(--rt-dropzone-padding-inline);
  border: var(--rt-border-dashed) dashed var(--stroke-strong);
  border-radius: var(--rt-dropzone-radius);
  text-align: center;
  cursor: pointer;
  background: var(--panel-2);
  transition: border .15s;
}

.dropzone:hover {
  border-color: var(--accent);
}

.drop-icon {
  height: 49px;
  width: 49px;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 13px;
  display: grid;
  place-items: center;
  margin: 0 auto 15px;
}

.dropzone h3 {
  font-size:var(--rt-font-lg);
  margin: 0 0 7px;
}

.dropzone p {
  font-size:var(--rt-font-xs);
  color: var(--muted);
  margin: 0 0 17px;
}

.file-chip {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--stroke);
  border-radius: 11px;
  padding: 11px 13px;
}

.file-name {
  font-size:var(--rt-font-xs);
  font-weight: 800;
  word-break: break-all;
}

.file-size {
  font-size:var(--rt-font-xxs);
  margin-top: 4px;
  color: var(--muted);
}

.file-upload-hidden {
  display: none;
}

.field {
  margin-top: 18px;
}

.field label,.field-title {
  display: block;
  color: var(--text);
  font-size:var(--rt-font-xs);
  font-weight: 750;
  margin-bottom: 9px;
}

.field input,.field select,.login-field {
  width: 100%;
  height: var(--rt-field-height);
  border: 1px solid var(--stroke);
  background: var(--input);
  border-radius: var(--rt-field-radius);
  color: var(--text);
  padding: 0 12px;
  font-size:var(--rt-font-sm);
}

.field-hint {
  font-size:var(--rt-font-xxs);
  color: var(--muted);
  line-height: 1.6;
  margin: 7px 0 0;
}

.choose-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.choose-row {
  display: flex;
  align-items: center;
  gap: 11px;
  justify-content: space-between;
  padding: 12px;
  border-radius: 10px;
  background: var(--panel-2);
  border: 1px solid var(--stroke);
  cursor: pointer;
}

.choose-row.checked {
  border-color: rgba(244,122,40,.55);
}

.choose-row .mini {
  font-size:var(--rt-font-xs);
  font-weight: 800;
}

.choose-row .under {
  font-size:var(--rt-font-xxs);
  color: var(--muted);
  margin-top: 4px;
}

.choose-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.summary-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 2px 0 18px;
}

.sum-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  font-size:var(--rt-font-xs);
  color: var(--muted);
}

.sum-row strong {
  color: var(--text);
  font-weight: 750;
  text-align: right;
}

.notice {
  border-radius: 10px;
  padding: 11px 13px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size:var(--rt-font-xxs);
  line-height: 1.6;
  color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--stroke);
}

.notice .ico {
  color: var(--accent);
}

.notice.warn {
  border-color: rgba(244,122,40,.2);
  background: var(--accent-soft);
}

.notice.warn .ico {
  color: var(--accent);
}

.line-divider {
  height: 1px;
  background: var(--stroke);
  margin: 19px 0;
}

.transfer-summary {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: var(--rt-transfer-summary-gap);
}

.transfer-kpi {
  background: var(--panel-2);
  border: 1px solid var(--stroke);
  padding: 14px 16px;
  border-radius: 11px;
}

.transfer-kpi strong {
  font-size:var(--rt-font-4xl);
  font-family: var(--rt-font-family-heading);
  letter-spacing: -.055em;
  display: block;
}

.transfer-kpi small {
  font-size:var(--rt-font-xxs);
  color: var(--muted);
  display: block;
  margin-top: 6px;
}

.transfer-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.detail-grid {
  display: grid;
  grid-template-columns: minmax(0,1.35fr) minmax(290px,.65fr);
  gap: var(--rt-grid-gap);
}

.detail-side .card+.card {
  margin-top: 18px;
}

.detail-metrics {
  padding: 0 20px 18px;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 0;
  border-bottom: 1px solid var(--stroke);
  color: var(--muted);
  font-size:var(--rt-font-xs);
}

.detail-row:last-child {
  border-bottom: none;
}

.detail-row strong {
  color: var(--text);
  font-weight: 750;
}

.history-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 330px;
  text-align: center;
  padding: 25px;
  color: var(--muted);
}

.history-empty h3 {
  font-size:var(--rt-font-2xl);
  color: var(--text);
  margin: 15px 0 7px;
}

.history-empty p {
  max-width: 390px;
  font-size:var(--rt-font-sm);
}

.history-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 16px 21px;
  border-top: 1px solid var(--stroke);
}

.history-row h3 {
  font-size:var(--rt-font-sm);
  margin: 0 0 6px;
}

.history-row p {
  font-size:var(--rt-font-xxs);
  color: var(--muted);
  margin: 0;
}

.settings-grid {
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1fr);
  gap: var(--rt-grid-gap);
}

.setting-item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 16px 0;
  border-top: 1px solid var(--stroke);
}

.setting-item:first-child {
  border-top: 0;
}

.setting-item strong {
  font-size:var(--rt-font-sm);
}

.setting-item p {
  font-size:var(--rt-font-xxs);
  color: var(--muted);
  margin: 6px 0 0;
  line-height: 1.6;
}

.segmented {
  display: flex;
  border: 1px solid var(--stroke);
  border-radius: 10px;
  background: var(--panel-2);
  padding: 3px;
  gap: 3px;
  flex-shrink: 0;
}

.segmented button {
  padding: 7px 10px;
  border-radius: 7px;
  border: 0;
  font-size:var(--rt-font-xs);
  font-weight: 750;
  color: var(--muted);
  background: transparent;
}

.segmented button.active {
  color: var(--accent);
  background: var(--panel);
  box-shadow: none;
}

.security-list {
  padding: 0 20px 22px;
  color: var(--muted);
  font-size:var(--rt-font-xs);
  line-height: 1.8;
}

.security-list li+li {
  margin-top: 7px;
}

.auth-cover {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(4,5,8,.75);
  backdrop-filter: none;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.auth-dialog {
  width: 100%;
  max-width: var(--rt-login-width);
  padding: var(--rt-dialog-padding);
  background: var(--panel);
  border: 1px solid var(--stroke-strong);
  border-radius: var(--rt-radius-xl);
  box-shadow: none;
  position: relative;
}

.auth-dialog h2 {
  font-size:var(--rt-font-5xl);
  margin: 22px 0 9px;
}

.auth-dialog p {
  font-size:var(--rt-font-sm);
  color: var(--muted);
  margin: 0 0 23px;
}

.auth-dialog .close-btn {
  position: absolute;
  right: 20px;
  top: 20px;
}

.auth-dialog label {
  display: block;
  font-weight: 750;
  font-size:var(--rt-font-xs);
  margin: 16px 0 9px;
}

.auth-dialog .btn {
  margin-top: 19px;
}

.toast-stack {
  position: fixed;
  bottom: 20px;
  right: 22px;
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  max-width: 360px;
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--stroke-strong);
  border-radius: 11px;
  box-shadow: none;
  padding: 13px 15px;
  font-size:var(--rt-font-xs);
  font-weight: 650;
}

.toast svg {
  color: var(--accent);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

.mobile-menu {
  display: none;
}

.prototype-banner {
  padding: 11px 15px;
  background: var(--orbon);
  border: 1px solid rgba(244,122,40,.18);
  border-radius: 9px;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  font-size:var(--rt-font-xxs);
  margin-bottom: 20px;
  line-height: 1.5;
}

.prototype-banner strong {
  color: var(--accent);
}

.spaced {
  margin-top: 20px;
}

.text-accent {
  color: var(--accent);
}

.list-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.floating-inline {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.footer-hint {
  font-size:var(--rt-font-xxs);
  color: var(--muted);
  line-height: 1.7;
  margin-top: 17px;
}

.code-text {
  font-family: var(--rt-font-family-mono);
  font-size:var(--rt-font-xs);
  color: var(--muted);
}

@keyframes flow {
  to {
    stroke-dashoffset: -32;
  }
}

@media (prefers-reduced-motion:reduce) {
  *,*:before,*:after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

@media (max-width:1300px) {
  .sidebar {
    width: 220px;
    flex-basis: 220px;
  }

  .main {
    max-width: calc(100% - 220px);
  }

  .content {
    padding: 29px 27px 50px;
  }

  .topbar {
    padding: 0 27px;
  }

  .split {
    grid-template-columns: minmax(0,1.4fr) minmax(260px,.8fr);
  }

  .flow-tag.wan1 {
    left: 31%;
  }

  .flow-tag.wan2 {
    left: 70%;
  }
}

@media (max-width:1100px) {
  .stats {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }

  .split,.detail-grid {
    grid-template-columns: 1fr;
  }

  .device-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }

  .graph-node {
    width: 145px;
  }

  .lower-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width:850px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
    transition: transform .2s;
    box-shadow: none;
    width: 240px;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .main {
    max-width: none;
    width: 100%;
  }

  .mobile-menu {
    display: grid;
  }

  .content {
    padding: 22px 17px 40px;
  }

  .topbar {
    height: 65px;
    padding: 0 17px;
  }

  .top-actions {
    gap: 6px;
  }

  .form-grid,.settings-grid,.lower-grid {
    grid-template-columns: 1fr;
  }

  .page-head {
    flex-wrap: wrap;
  }

  .head-buttons {
    width: 100%;
  }

  .head-buttons .btn {
    flex: 1;
  }

  .device-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }

  .pill.top-demo {
    display: none;
  }

  .sidebar-scrim {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 9;
  }

  .sidebar-scrim.visible {
    display: block;
  }
}

@media (max-width:560px) {
  .page-head h1 {
    font-size: 24px;
  }

  .stats {
    gap: 9px;
  }

  .stat-card {
    padding: 15px;
  }

  .stat-value {
    font-size:var(--rt-font-5xl);
  }

  .card-header {
    padding: 16px 15px;
  }

  .card-body {
    padding: 0 15px 16px;
  }

  .device-grid {
    grid-template-columns: 1fr;
  }

  .transfer-summary {
    grid-template-columns: 1fr 1fr;
  }

  .topology-canvas {
    height: 340px;
  }

  .graph-node {
    width: 117px;
    min-height: 67px;
    padding: 7px;
    border-radius: 10px;
  }

  .node-title {
    font-size:var(--rt-font-xxs);
  }

  .node-icon {
    width: 24px;
    height: 24px;
  }

  .node-sub {
    font-size: 8px;
  }

  .node-percent {
    font-size: 8px;
  }

  .flow-tag {
    font-size: 8px;
  }

  .flow-tag.wan1 {
    left: 26%;
  }

  .flow-tag.wan2 {
    left: 75%;
  }

  .flow-tag.lan {
    left: 50%;
    top: 60%;
  }

  .legend {
    gap: 10px;
  }

  .graph-note {
    gap: 9px;
  }

  .crumb {
    font-size:var(--rt-font-xs);
  }

  .topbar .avatar {
    display: none;
  }

  .pill {
    font-size: 9px;
  }

  .history-row {
    flex-wrap: wrap;
  }

  .step-header {
    align-items: flex-start;
  }
}

/* Light-mode accessible text accent; does not change orange CTA backgrounds. */
body[data-theme="light"] .eyebrow,
body[data-theme="light"] .text-accent,
body[data-theme="light"] .nav-btn.active,
body[data-theme="light"] .pill.amber,
body[data-theme="light"] .tag.orange,
body[data-theme="light"] .prototype-banner strong {
  color: var(--rt-accent-on-surface);
}

/* ============================================================
   RATATOSS v1.2 — approved compact visual refresh
   Clean flat UI. No halo, bloom, glow, layered shadow, glass blur.
   Brand image: actual user-supplied Ratatoss squirrel, transparent.
   ============================================================ */

body, .sidebar, .card, .graph-node, .icon-btn, .nav-btn, .stat-card, .auth-dialog, .toast, .side-profile, .btn, .device-card { box-shadow: none; filter: none !important; backdrop-filter: none; text-shadow: none !important; }
.brand { gap: 10px; padding: 0 8px 24px; }
.brand-logo { width: var(--rt-logo-width); height: var(--rt-logo-height); object-fit: contain; border-radius: 0; background: none; box-shadow: none; flex-shrink: 0; }
.auth-dialog .brand-logo { width: 92px; height: 68px; object-fit: contain; }
.brand-title { font-size: 19px; letter-spacing: -.035em; font-weight: 800; }
.brand-sub, .side-label { display: none; }
.sidebar { padding-top: 22px; }
.nav-btn { font-size: 13px; font-weight: 600; height: 42px; gap: 12px; }
.nav-btn svg { width: 19px; height: 19px; }
.nav-btn.active { background: var(--accent-soft); border-color: transparent; }
.topbar { min-height: var(--rt-topbar-height); }
.top-demo { letter-spacing: .055em; font-size: 10px; }
.content { width: 100%; }
.page-head { margin-bottom: 20px; align-items: center; }
.page-head h1 { font-size: clamp(24px,2.25vw,29px); margin-bottom: 0; letter-spacing: -.035em; }
.page-head p { margin-top: 5px; }
.eyebrow { display:none; }
.head-buttons { margin-top: 0; }
.stats { gap: 14px; margin-bottom: 16px; }
.stat-card { padding: 17px 18px 15px; }
.stat-value { margin-top: 5px; }
.stat-meta { display:none; }
.split, .lower-grid, .detail-grid, .form-grid, .settings-grid { gap: 16px; }
.card-desc { margin-top: 5px; }
.card-header { padding: var(--rt-card-header-padding); }
.graph-node { box-shadow: none; transition: border-color .15s,background .15s; }
.graph-node.selected, .graph-node:hover { border-color: var(--accent); box-shadow: none; }
.graph-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.topology-canvas { background-image: radial-gradient(var(--outline) .7px,transparent .7px); }
.graph-note { min-height: 43px; }
.mini-info, .prototype-banner, .engine-card { display: none; }
.event-sub { display:none; }
.dropzone, .notice, .auth-cover, .toast { backdrop-filter: none; }
.auth-cover { background: rgba(0,0,0,.60); }
.auth-dialog { border: 1px solid var(--stroke-strong); }
.icon-btn:hover, .btn:hover { box-shadow: none; }
/* Compact UX: text is for actions, data and status; avoid duplicated helper copy. */
.step-header p, .setting-item p, .field-hint, .footer-hint { display:none; }
.settings-grid .card-header .card-desc { display:none; }
/* Preserve readable contrast in both light and dark without glow. */
body[data-theme="dark"] { --shadow:none; }
body[data-theme="light"] { --shadow:none; }
@media (max-width: 850px) { :root { --rt-content-inline: 20px; --rt-content-top: 22px; } }
@media (max-width: 560px) { :root { --rt-content-inline: 14px; --rt-content-top: 18px; --rt-graph-height: 320px; } .brand-logo { width: 49px; height: 38px; } .page-head h1 { font-size: 23px; } }

/* Mobile: keep compact DEMO indicator visible to avoid conflating mock and real transfers. */
@media (max-width:850px) { .pill.top-demo { display:inline-flex; padding:4px 7px; font-size:9px; gap:3px; } .pill.top-demo svg { display:none; } }

function renderSidebar(){return `<aside class="sidebar ${state.menuOpen?'open':''}" aria-label="Thanh điều hướng"><div class="brand">${logo()}<div><div class="brand-title">ratatoss<span class="text-accent">.</span></div></div></div><nav class="side-nav" aria-label="Chức năng">${nav.map(item=>`<button class="nav-btn ${state.page===item.id?'active':''}" data-nav="${item.id}" ${state.page===item.id?'aria-current="page"':''}>${ico(item.icon,17)}<span>${item.label}</span>${item.id==='transfers'&&state.job?.status==='running'?'<span class="nav-count">1</span>':''}</button>`).join('')}</nav><div class="side-spacer"></div><button class="side-profile" data-action="profile" aria-label="Mở đăng nhập demo"><span class="avatar">${state.signedIn?esc(state.name).slice(0,2).toUpperCase():'RT'}</span><span><span class="profile-name">${esc(state.name)}</span><span class="profile-caption">${state.signedIn?'Hồ sơ cục bộ (demo)':'Đăng nhập demo'}</span></span>${ico('chevron',15)}</button></aside>`}
function renderTopbar(){const label=nav.find(n=>n.id===state.page)?.label||'Tổng quan';return `<header class="topbar"><div class="floating-inline"><button class="icon-btn mobile-menu" aria-label="Mở menu" data-action="menu">${ico('menu',19)}</button><div class="crumb">Workspace <span class="crumb-sep">/</span><strong>${label}</strong></div></div><div class="top-actions"><span class="pill amber top-demo">${ico('spark',12)} DEMO</span><button class="icon-btn" data-action="theme" title="Đổi sáng tối" aria-label="Đổi chế độ sáng tối">${ico(state.theme==='dark'?'sun':'moon',18)}</button><button class="avatar" data-action="profile" aria-label="Hồ sơ demo" style="border:0;cursor:pointer">${state.signedIn?esc(state.name).slice(0,2).toUpperCase():'RT'}</button></div></header>`}
function banner(){return ''} // Compact permanent DEMO indicator in topbar replaces repeated banners.
function header(eyebrow,title,desc,buttons=''){return `<div class="page-head"><div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>${buttons?`<div class="head-buttons">${buttons}</div>`:''}</div>`}
function statCard(label,value,meta,icon){return `<div class="stat-card"><div class="stat-label">${label}<span class="stat-icon">${ico(icon,16)}</span></div><div class="stat-value">${value}</div></div>`}
function progressList(){const ids=state.job?.recipients||[];return `<div class="right-list">${ids.map(id=>{const p=peers.find(x=>x.id===id),offline=peerStatus(id)==='offline',verified=peerStatus(id)==='verified';return `<div class="peer-progress"><div class="pp-top"><span class="device-icon">${ico('monitor',17)}</span><div><div class="pp-name">${esc(p?.name||id)}</div><div class="pp-sub">${offline?'Mất kết nối':verified?'Đã xác minh':peerStatus(id)==='verifying'?'Đang xác minh':'Đang nhận'}</div></div><span class="pp-pct">${pct(id)}%</span></div><div class="progress-track"><div class="progress-fill ${offline?'red':verified?'green':''}" style="width:${pct(id)}%"></div></div></div>`}).join('')||'<div class="history-empty">Chưa có người nhận</div>'}</div>`}
function netDiagram() {
  // SCHEMATIC demo only. Production edges must come from authorized assignments.
  const job = state.job;
  const visibleIds = new Set(['A', ...(job?.recipients || ['B', 'C', 'D'])]);
  const offlineIds = new Set(job?.offline || []);
  const active = !!job && job.status === 'running' && !job.paused;
  const available = (id) => visibleIds.has(id) && !offlineIds.has(id);
  const liveClass = (from, to, local = false) => {
    if (offlineIds.has(from) || offlineIds.has(to)) return 'offline-flow';
    return active ? (local ? 'active-flow local-flow' : 'active-flow') : '';
  };
  const path = (from, to, d, local = false) =>
    visibleIds.has(from) && visibleIds.has(to)
      ? `<path class="${liveClass(from, to, local)}" d="${d}"/>` : '';
  const nodeHtml = peers.filter(p => visibleIds.has(p.id)).map(p => {
    const pos = { A:[50,17], B:[25.5,52], C:[74.5,52], D:[50,85] }[p.id];
    const status = peerStatus(p.id);
    const progress = p.id === 'A' ? 100 : pct(p.id);
    const detail = p.id === 'A' ? 'SOURCE / 100%' :
      status === 'offline' ? 'OFFLINE' :
      status === 'verified' ? 'VERIFIED' :
      status === 'verifying' ? 'VERIFYING' : `${progress}% RECEIVED`;
    return `<button class="graph-node ${state.selectedNode === p.id ? 'selected' : ''} ${status === 'offline' ? 'offline' : ''}"
      data-node="${p.id}" style="left:${pos[0]}%;top:${pos[1]}%" aria-pressed="${state.selectedNode === p.id}"
      aria-label="Xem chi tiết ${esc(p.name)}">
      <div class="node-top"><span class="node-icon">${ico(p.id === 'A' ? 'harddrive' : 'monitor',15)}</span>

      <div class="node-progress"><span style="width:${progress}%"></span></div>
      <div class="node-percent"><span>${detail}</span><span>${p.id}</span></div></button>`;
  }).join('');
  const hasBC = visibleIds.has('B') && visibleIds.has('C');
  const hasD = visibleIds.has('D');
  return `<div class="topology-canvas" role="group" aria-label="Sơ đồ mạng P2P minh họa, không phải liên kết đo được">
    <svg class="net-lines" viewBox="0 0 900 430" preserveAspectRatio="none" aria-hidden="true">
      ${path('A','B','M 425 100 Q 350 150 260 190')}
      ${path('A','C','M 475 100 Q 555 150 640 190')}
      ${path('B','C','M 305 224 Q 450 190 595 224',true)}
      ${path('C','B','M 595 238 Q 450 275 305 238',true)}
      ${path('B','D','M 265 242 Q 310 306 427 352')}
      ${path('C','D','M 635 242 Q 595 305 473 352')}
      ${hasD ? '<path class="conditional" d="M 480 76 C 820 22 845 360 484 379"/>' : ''}
    </svg>
    ${visibleIds.has('B') ? '<span class="flow-tag wan1">WAN <span>•</span> A → B</span>' : ''}
    ${visibleIds.has('C') ? '<span class="flow-tag wan2">WAN <span>•</span> A → C</span>' : ''}
    ${hasBC ? '<span class="flow-tag lan">LAN ↔ <span>B / C</span></span>' : ''}
    ${hasD ? '<span class="flow-tag down">WAN → D</span>' : ''}
    ${nodeHtml}
  </div>`;
}

let fileTimer;
let loginTrigger = null;
function openLogin(trigger) { loginTrigger = trigger || document.activeElement; state.loginOpen = true; render(); requestAnimationFrame(() => document.querySelector('#login-name, [data-action="logout"]')?.focus()); }
function closeLogin() { state.loginOpen = false; render(); requestAnimationFrame(() => loginTrigger?.focus?.()); }
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-action],[data-peer],[data-node],[data-settheme]');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.peer){selectPeer(b.dataset.peer);return}if(b.dataset.node){state.selectedNode=b.dataset.node;render();return}if(b.dataset.settheme){toggleTheme(b.dataset.settheme);return}switch(b.dataset.action){case'theme':toggleTheme();break;case'menu':state.menuOpen=true;render();break;case'close-menu':state.menuOpen=false;render();break;case'profile':openLogin(b);break;case'close-login':closeLogin();break;case'logout':state.signedIn=false;state.name='Khách demo';state.loginOpen=false;render();break;case'pick-file':document.getElementById('file-input')?.click();break;case'remove-file':state.file=null;render();break;case'start-job':startJob();break;case'pause':if(state.job){state.job.paused=true;addEvent('Tạm dừng đồng hồ mô phỏng — không dừng Croc thực');render()}break;case'resume':if(state.job){state.job.paused=false;addEvent('Tiếp tục đồng hồ mô phỏng');render()}break;case'toggle-offline':if(!state.job)return;const off=state.job.offline.includes('C');state.job.offline=off?state.job.offline.filter(x=>x!=='C'):[...state.job.offline,'C'];addEvent(off?'C quay lại: cần reconcile từ disk trong bản thật':'C offline: trong bản thật chỉ giao lại batch còn thiếu','warning');render();break;default:break;}});
document.addEventListener('change',e=>{if(e.target.id==='file-input'){const f=e.target.files?.[0];if(f){state.file={name:f.name,size:f.size};render()}return}if(e.target.dataset.setting==='strategy'){state.strategy=e.target.value;render();return}if(['maxRx','maxTx','limitMbps'].includes(e.target.dataset.setting)){state.settings[e.target.dataset.setting]=Number(e.target.value);render()}});
document.addEventListener('input',e=>{if(e.target.id==='peer-search'){const term=e.target.value.toLocaleLowerCase('vi-VN');document.querySelectorAll('[data-device-card]').forEach(el=>{const p=peers.find(x=>x.id===el.dataset.deviceCard);el.style.display=`${p.name} ${p.area} ${p.alias}`.toLocaleLowerCase('vi-VN').includes(term)?'':'none'})}});
document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();const form=new FormData(e.target);const name=String(form.get('name')||'').trim().slice(0,36);if(!name)return;state.name=name;state.signedIn=true;state.loginOpen=false;toast('Đã vào hồ sơ demo cục bộ — không có xác thực thật.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.loginOpen){closeLogin()}if(e.key==='Tab'&&state.loginOpen){const root=document.querySelector('.auth-dialog');const focusables=[...root.querySelectorAll('button:not([disabled]),input:not([disabled])')];if(focusables.length){const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('dropzone')){e.preventDefault();document.getElementById('file-input')?.click()}});
document.addEventListener('dragover',e=>{if(e.target.closest?.('.dropzone')){e.preventDefault();e.dataTransfer.dropEffect='copy'}});
document.addEventListener('drop',e=>{const drop=e.target.closest?.('.dropzone');if(!drop)return;e.preventDefault();const f=e.dataTransfer?.files?.[0];if(f){state.file={name:f.name,size:f.size};render()}});
render();fileTimer=setInterval(tickSimulation,1800);

</script></body></html>
