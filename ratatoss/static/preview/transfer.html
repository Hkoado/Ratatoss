<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ratatoss · Nhận và Tiến độ (DEMO)</title>
  <link rel="stylesheet" href="../transfer-ui.css">
  <script defer src="../transfer-ui.js"></script>
  <script defer src="demo-data.js"></script>
</head>
<body class="rt-transfer rt-transfer-preview">
  <header class="rt-transfer-topbar">
    <div class="rt-transfer-brand">
      <h1 class="rt-transfer-title">Ratatoss</h1>
      <span class="rt-transfer-demo">DEMO</span>
    </div>
  </header>
  <main class="rt-transfer-preview-grid">
    <div>
      <label class="rt-transfer-case">
        <span class="rt-transfer-label">Ca thử Nhận</span>
        <select class="rt-transfer-select" id="offer-case"></select>
      </label>
      <div id="offer"></div>
    </div>
    <div>
      <label class="rt-transfer-case">
        <span class="rt-transfer-label">Ca thử Tiến độ</span>
        <select class="rt-transfer-select" id="progress-case"></select>
      </label>
      <div id="progress"></div>
    </div>
  </main>
</body>
</html>
