name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  originals:
    name: Verify original documents
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify checkout with the trusted Git revision
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          checker=spec/governance/verify_originals.py
          manifest=spec/governance/originals.sha256.json
          git cat-file -e "$TRUSTED_SHA^{commit}"

          trusted_dir="$(mktemp -d)"
          git archive "$TRUSTED_SHA" "$checker" "$manifest" | tar -x -C "$trusted_dir"
          cmp "$trusted_dir/$checker" "$checker"
          cmp "$trusted_dir/$manifest" "$manifest"

          python - "$checker" "$manifest" <<'PY'
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z", "--", "docs", "plan", *sys.argv[1:]])
          attributes = subprocess.check_output(["git", "check-attr", "--stdin", "-z", "text"], input=paths)
          fields = attributes.split(b"\0")
          invalid = [path for path, value in zip(fields[::3], fields[2::3]) if value != b"unset"]
          if invalid:
              raise SystemExit(f"Expected -text for: {invalid!r}")
          PY
          python "$trusted_dir/$checker" --root "$GITHUB_WORKSPACE"

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.14']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $wheelDir = Join-Path $env:RUNNER_TEMP wheel
          python -m pip wheel . --no-deps --wheel-dir $wheelDir
          $wheel = Get-ChildItem -LiteralPath $wheelDir -Filter 'ratatoss-*.whl'
          if (@($wheel).Count -ne 1) { throw "Expected one Ratatoss wheel" }
          python -m pip install $wheel.FullName
      - name: Verify source checkout
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s tests -v
          python spec/db/validate.py
          python spec/ui-kit/scripts/build_preview.py --check
      - name: Verify the installed CLI and package resources outside the checkout
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $smoke = Join-Path $env:RUNNER_TEMP ratatoss-wheel-smoke
          New-Item -ItemType Directory -Path $smoke | Out-Null
          Copy-Item -LiteralPath tests -Destination $smoke -Recurse
          Set-Location -LiteralPath $smoke

          @'
          import os
          from importlib.resources import files
          from pathlib import Path

          import ratatoss

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if Path(ratatoss.__file__).resolve().is_relative_to(checkout):
              raise SystemExit("Wheel smoke imported Ratatoss from the checkout")
          for schema in ("node.sql", "controller.sql"):
              packaged = files("ratatoss").joinpath("_sql", schema).read_bytes()
              if packaged != (checkout / "spec" / "db" / schema).read_bytes():
                  raise SystemExit(f"Packaged DDL differs from canonical DDL: {schema}")
          '@ | python -
          ratatoss --help
          python -m unittest discover -s tests -v
