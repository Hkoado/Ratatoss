name: macOS Starter
on:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/macos/**'
      - 'ratatoss/**'
      - 'spec/db/node.sql'
      - 'pyproject.toml'
      - '.github/workflows/macos-starter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Build arm64 disk image
        run: |
          uv python install 3.11.18
          uv venv --python 3.11.18 --managed-python .venv
          uv pip install -r packaging/macos/requirements-build.txt
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/croc.tgz" \
            https://github.com/schollz/croc/releases/download/v11.6.5/croc_v11.6.5_macOS-ARM64.tar.gz
          .venv/bin/python packaging/macos/build.py --croc-archive "$RUNNER_TEMP/croc.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ratatoss-Starter-macos-arm64
          path: dist/macos/
          if-no-files-found: error
  installed-smoke:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/macos/smoke.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Ratatoss-Starter-macos-arm64
          path: ${{ runner.temp }}/macos-installer
      - name: Install and exercise the exact DMG as the runner user
        run: /usr/bin/python3 packaging/macos/smoke.py "$RUNNER_TEMP"/macos-installer/*.dmg
