[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratatoss"
version = "0.1.0"
description = "Ratatoss local node starter"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.111,<1", "uvicorn>=0.29,<1"]

[project.scripts]
ratatoss = "ratatoss.__main__:main"

[tool.setuptools]
packages = ["ratatoss"]

[tool.setuptools.package-data]
ratatoss = ["static/*"]
